# Erase-World default config (paper-aligned defaults where applicable)
# Checkpoint: black-forest-labs/FLUX.2-klein-4B (frozen)
# Prior: I-JEPA ViT-H/14-1K (frozen)

method: erase_world

devices:
  flux: cuda:0
  ijepa: auto

flux:
  model_id: black-forest-labs/FLUX.2-klein-4B
  num_inference_steps: 14          # T
  guidance_scale_flux: 3.5         # w_cfg (paper)
  guidance_scale_early: 3.5
  guidance_scale_late: 1.5
  guidance_switch_step: 5
  strength: 1.0
  seed: 22
  max_side: 768                    # input longest side
  prompt_variant: full
  # Paper Full prompt (also in erase_world/prompts.py)
  prompt: >-
    Clean empty background, seamless inpainting, natural lighting,
    no object, no person, no cast shadow, no contact shading, no text,
    photorealistic.
  negative_prompt: >-
    object, person, animal, text, watermark, logo, blurry, low quality,
    extra limbs, distorted, silhouette, floating debris, shadow residual.
  mask_blur: 5
  source_prefill: true
  source_prefill_ring_px: 24
  gray_prefill: false
  use_contact_shadow: true
  dilate_r: 4                      # r
  pure_noise_mask_init: false
  padding_mask_crop: null

ijepa:
  model_name: facebook/ijepa_vith14_1k
  # Place official checkpoint under ./checkpoints/ or ~/.cache/erase-world/
  # See docs/DATA.md
  checkpoint: auto
  img_size: 224                    # JEPA preview
  pred_depth: 12
  pred_emb_dim: 384

guidance:
  enabled: true
  stable_guidance: true
  # Optional modules off by default (paper lean Full stack)
  counterfactual_guidance: false
  cast_shadow_module: false
  shadow_physics: false
  dual_instance_guidance: false
  retinex_illum: false
  layered_light_guidance: false
  attentive_eraser: false
  # Paper: T_guide={4,2}; runtime uses struct_end_step + every_n (see METHOD_ALIGNMENT.md)
  struct_end_step: 4
  struct_guidance_every_n: 2
  illum_guide_every_n: 2
  struct_weight: 1.2
  light_weight_struct: 0.3
  light_weight_fine: 0.8
  shadow_down_ratio: 0.5
  shadow_pin_release: 0.3
  mask_run_dilate_px: 4            # r
  guidance_scale: 0.45             # eta
  guidance_intra_decay: 1.0
  grad_clip_norm: 0.5
  loss_type: mse
  latent_pin_visible: true
  pin_visible_before_jepa: true
  fast_vae_decode: true
  grad_mode: latent_std
  dynamics_inner_steps: 1

eval:
  size: 1024
  seeds: [22, 23, 24, 25, 26]      # seed-averaged (not best-of-5)
