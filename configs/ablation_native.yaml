# Ablation: Pure FLUX.2 / native (no PredErase modules)
method: flux_fill_native

devices:
  flux: cuda:0
  ijepa: auto

flux:
  model_id: black-forest-labs/FLUX.2-klein-4B
  num_inference_steps: 14
  guidance_scale_flux: 3.5
  guidance_scale_early: 3.5
  guidance_scale_late: 1.5
  guidance_switch_step: 5
  strength: 1.0
  seed: 22
  max_side: 768
  prompt_variant: short
  prompt: remove the object and fill the background
  source_prefill: false
  gray_prefill: false
  use_contact_shadow: false
  use_m_flux_for_native: false
  dilate_r: 0
  mask_blur: 5

ijepa:
  checkpoint: auto
  img_size: 224

guidance:
  enabled: false
  mask_run_dilate_px: 0
  guidance_scale: 0.0
